name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  local-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install only chat dependencies and the test runner
        run: python -m pip install -r requirements-core.txt pytest
      - name: Exercise isolated first chat with a local Ollama fixture
        run: >-
          python -m pytest -q
          agent_core/tests/test_start_chat.py
          agent_core/tests/test_first_run_credentials.py
          agent_core/tests/test_chat_quickstart_integration.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-timeout

      - name: Run tests
        run: |
          python -m pytest agent_core/tests/ -q --tb=short -x --timeout=60

      - name: Browser protocol and voice tests
        run: |
          node --test agent_core/tests/test_chat_voice.mjs agent_core/tests/test_chat_work.mjs agent_core/tests/js/test_polling.cjs

      - name: Smoke test imports
        run: |
          python -c "from agent_core.homeostasis.core import HomeostasisCore; print('OK: HomeostasisCore')"
          python -c "from agent_core.planner.planner_core import PlannerCore; print('OK: PlannerCore')"
          python -c "from agent_core.proactive import ProactiveScheduler; print('OK: ProactiveScheduler')"
          python -c "from agent_core.consciousness.user_profile import UserProfile; print('OK: UserProfile')"
